services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_NAME}", "-U", "${DB_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build: .
    command: ["/bin/migrate", "-cmd", "up"]
    env_file: .env.docker
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: ["/bin/app"]
    env_file: .env.docker
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata: